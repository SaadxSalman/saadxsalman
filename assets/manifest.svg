<svg width="1200" height="244" viewBox="0 0 1200 244" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="System Manifest — Capability Matrix">

  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#040810"/>
      <stop offset="100%" stop-color="#020508"/>
    </linearGradient>
    <linearGradient id="barCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C8F0"/>
      <stop offset="100%" stop-color="#007BA8"/>
    </linearGradient>
    <linearGradient id="barVio" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A7CFF"/>
      <stop offset="100%" stop-color="#5544CC"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="244" fill="url(#mbg)"/>

  <!-- Terminal grid lines -->
  <g stroke="#00D4FF" stroke-width="0.5" stroke-opacity="0.025">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
  </g>

  <!-- Panel border -->
  <rect x="14" y="14" width="1172" height="216" fill="none" stroke="#0D1C2E" stroke-width="1"/>

  <!-- Vertical separator -->
  <line x1="600" y1="22" x2="600" y2="222" stroke="#0D1C2E" stroke-width="1"/>

  <g font-family="'JetBrains Mono','Courier New',monospace">

    <!-- === LEFT: SYSTEM MANIFEST === -->

    <text x="50" y="42" font-size="10.5" letter-spacing="4" fill="#00E5FF" fill-opacity="0.88">▸  SYSTEM MANIFEST</text>

    <!-- Animated header underline -->
    <line x1="50" y1="50" x2="572" y2="50" stroke="#0D1C2E" stroke-width="1"/>
    <line x1="50" y1="50" x2="572" y2="50" stroke="#00E5FF" stroke-width="1" stroke-dasharray="80 442" stroke-opacity="0.3">
      <animate attributeName="stroke-dashoffset" from="522" to="0" dur="6s" repeatCount="indefinite"/>
    </line>

    <!-- Key-value rows -->
    <text x="50" y="76" font-size="9.5" letter-spacing="2" fill="#243850">OPERATOR</text>
    <text x="195" y="76" font-size="9.5" letter-spacing="1.5" fill="#8AA8C8">Saad Salman</text>

    <text x="50" y="99" font-size="9.5" letter-spacing="2" fill="#243850">CLASS</text>
    <text x="195" y="99" font-size="9.5" letter-spacing="1.5" fill="#8AA8C8">Deep Learning Systems Engineer</text>

    <text x="50" y="122" font-size="9.5" letter-spacing="2" fill="#243850">DOMAIN</text>
    <text x="195" y="122" font-size="9.5" letter-spacing="1.5" fill="#8AA8C8">LLM Systems · SLM Optimization</text>

    <text x="50" y="145" font-size="9.5" letter-spacing="2" fill="#243850">LAYER</text>
    <text x="195" y="145" font-size="9.5" letter-spacing="1.5" fill="#8AA8C8">Local Inference · Token Economy</text>

    <text x="50" y="168" font-size="9.5" letter-spacing="2" fill="#243850">OPEN SRC</text>
    <text x="195" y="168" font-size="9.5" letter-spacing="1.5" fill="#8AA8C8">vectorphile — unified ML primitive</text>

    <text x="50" y="191" font-size="9.5" letter-spacing="2" fill="#243850">LICENSE</text>
    <text x="195" y="191" font-size="9.5" letter-spacing="1.5" fill="#8AA8C8">Apache-2.0</text>

    <!-- STATUS with pulsing indicator -->
    <text x="50" y="215" font-size="9.5" letter-spacing="2" fill="#243850">STATUS</text>
    <circle cx="197" cy="211" r="3.5" fill="#3DFFA2">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="208" y="215" font-size="9.5" letter-spacing="2" fill="#3DFFA2">OPERATIONAL</text>
    <!-- Blinking cursor -->
    <rect x="338" y="204" width="5" height="11" fill="#3DFFA2">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>


    <!-- === RIGHT: CAPABILITY MATRIX === -->

    <text x="630" y="42" font-size="10.5" letter-spacing="4" fill="#8A7CFF" fill-opacity="0.88">▸  CAPABILITY MATRIX</text>

    <!-- Animated header underline -->
    <line x1="630" y1="50" x2="1150" y2="50" stroke="#0D1C2E" stroke-width="1"/>
    <line x1="630" y1="50" x2="1150" y2="50" stroke="#8A7CFF" stroke-width="1" stroke-dasharray="80 440" stroke-opacity="0.3">
      <animate attributeName="stroke-dashoffset" from="520" to="0" dur="6s" repeatCount="indefinite"/>
    </line>

    <!-- Skill bars — label | track | fill | pct -->

    <!-- LLM INFERENCE — 97% -->
    <text x="630" y="76" font-size="9.5" letter-spacing="1.8" fill="#243850">LLM INFERENCE</text>
    <rect x="855" y="68" width="265" height="4" fill="#07111C" rx="2"/>
    <rect x="855" y="68" width="0" height="4" fill="url(#barCyan)" rx="2">
      <animate attributeName="width" from="0" to="257" dur="1.2s" begin="0.1s" fill="freeze"/>
    </rect>
    <text x="1140" y="76" font-size="9" letter-spacing="1" fill="#00E5FF" fill-opacity="0.65" text-anchor="end">97%</text>

    <!-- SLM OPTIMIZATION — 94% -->
    <text x="630" y="99" font-size="9.5" letter-spacing="1.8" fill="#243850">SLM OPTIMIZATION</text>
    <rect x="855" y="91" width="265" height="4" fill="#07111C" rx="2"/>
    <rect x="855" y="91" width="0" height="4" fill="url(#barCyan)" rx="2">
      <animate attributeName="width" from="0" to="249" dur="1.2s" begin="0.3s" fill="freeze"/>
    </rect>
    <text x="1140" y="99" font-size="9" letter-spacing="1" fill="#00E5FF" fill-opacity="0.65" text-anchor="end">94%</text>

    <!-- AUTODIFF ENGINE — 96% -->
    <text x="630" y="122" font-size="9.5" letter-spacing="1.8" fill="#243850">AUTODIFF ENGINE</text>
    <rect x="855" y="114" width="265" height="4" fill="#07111C" rx="2"/>
    <rect x="855" y="114" width="0" height="4" fill="url(#barVio)" rx="2">
      <animate attributeName="width" from="0" to="254" dur="1.2s" begin="0.5s" fill="freeze"/>
    </rect>
    <text x="1140" y="122" font-size="9" letter-spacing="1" fill="#8A7CFF" fill-opacity="0.65" text-anchor="end">96%</text>

    <!-- QUANTIZATION — 88% -->
    <text x="630" y="145" font-size="9.5" letter-spacing="1.8" fill="#243850">QUANTIZATION</text>
    <rect x="855" y="137" width="265" height="4" fill="#07111C" rx="2"/>
    <rect x="855" y="137" width="0" height="4" fill="url(#barVio)" rx="2">
      <animate attributeName="width" from="0" to="233" dur="1.2s" begin="0.7s" fill="freeze"/>
    </rect>
    <text x="1140" y="145" font-size="9" letter-spacing="1" fill="#8A7CFF" fill-opacity="0.65" text-anchor="end">88%</text>

    <!-- OSS LIBRARY DESIGN — 92% -->
    <text x="630" y="168" font-size="9.5" letter-spacing="1.8" fill="#243850">OSS LIBRARY DESIGN</text>
    <rect x="855" y="160" width="265" height="4" fill="#07111C" rx="2"/>
    <rect x="855" y="160" width="0" height="4" fill="url(#barCyan)" rx="2">
      <animate attributeName="width" from="0" to="244" dur="1.2s" begin="0.9s" fill="freeze"/>
    </rect>
    <text x="1140" y="168" font-size="9" letter-spacing="1" fill="#00E5FF" fill-opacity="0.65" text-anchor="end">92%</text>

    <!-- SYSTEMS ARCHITECTURE — 85% -->
    <text x="630" y="191" font-size="9.5" letter-spacing="1.8" fill="#243850">SYSTEMS ARCHITECTURE</text>
    <rect x="855" y="183" width="265" height="4" fill="#07111C" rx="2"/>
    <rect x="855" y="183" width="0" height="4" fill="url(#barVio)" rx="2">
      <animate attributeName="width" from="0" to="225" dur="1.2s" begin="1.1s" fill="freeze"/>
    </rect>
    <text x="1140" y="191" font-size="9" letter-spacing="1" fill="#8A7CFF" fill-opacity="0.65" text-anchor="end">85%</text>

    <!-- Bottom row: build note -->
    <text x="630" y="215" font-size="9" letter-spacing="2" fill="#182A40">▸ CURRENT BUILD</text>
    <text x="755" y="215" font-size="9" letter-spacing="1.5" fill="#243850">vectorphile v0.5 — CUDA ext · fp16/bf16 · multi-node distributed</text>

  </g>

</svg>
