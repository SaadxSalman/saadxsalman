<svg width="1000" height="20" viewBox="0 0 1000 20" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="divider">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#00F0FF"/>
      <stop offset="0.5" stop-color="#B537F2"/>
      <stop offset="0.8" stop-color="#FF2A6D"/>
      <stop offset="1" stop-color="#FF2A6D" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="10" x2="1000" y2="10" stroke="url(#dg)" stroke-width="2" stroke-dasharray="26 14">
    <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1.6s" repeatCount="indefinite"/>
  </line>
  <circle cx="500" cy="10" r="3" fill="#00F0FF">
    <animate attributeName="r" values="3;6;3" dur="1.2s" repeatCount="indefinite"/>
  </circle>
</svg>
