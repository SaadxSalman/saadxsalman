<svg width="1200" height="12" viewBox="0 0 1200 12" xmlns="http://www.w3.org/2000/svg" aria-label="divider">
  <defs>
    <linearGradient id="dvg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#8A7CFF" stop-opacity="0.8"/>
      <stop offset="0.75" stop-color="#8A7CFF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#8A7CFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="6" x2="1200" y2="6" stroke="#1B2534" stroke-width="1"/>
  <line x1="0" y1="6" x2="1200" y2="6" stroke="url(#dvg)" stroke-width="1" stroke-dasharray="2 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="2.5s" repeatCount="indefinite"/>
  </line>
  <circle cx="40" cy="6" r="2.5" fill="#00E5FF">
    <animate attributeName="cx" from="40" to="1160" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
