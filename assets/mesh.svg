<svg width="1200" height="430" viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Local-first inference mesh">
  <defs>
    <pattern id="mgrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#7DD3FF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="430" fill="#05070B"/>
  <rect width="1200" height="430" fill="url(#mgrid)"/>

  <g font-family="'JetBrains Mono','Courier New',monospace">
    <text x="60" y="30" font-size="12" letter-spacing="3" fill="#3D4C63">LOCAL-FIRST INFERENCE MESH</text>
    <text x="1140" y="30" font-size="12" letter-spacing="3" fill="#3D4C63" text-anchor="end">CLOUD SPEND : MINIMIZED</text>

    <path id="p1" d="M 270 210 C 340 210 400 210 470 210" fill="none" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1.5"/>
    <path id="p2" d="M 730 185 C 810 175 850 100 920 97" fill="none" stroke="#8A7CFF" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 8"/>
    <path id="p3" d="M 730 235 C 810 245 850 330 920 338" fill="none" stroke="#3DFFA2" stroke-opacity="0.5" stroke-width="1.5"/>

    <path d="M 470 210 l -12 -6 v 12 z" fill="#00E5FF" fill-opacity="0.6"/>
    <path d="M 920 97 l -12 -5 v 10 z" fill="#8A7CFF" fill-opacity="0.6"/>
    <path d="M 920 338 l -12 -5 v 10 z" fill="#3DFFA2" fill-opacity="0.6"/>

    <g>
      <rect x="60" y="175" width="210" height="70" rx="10" fill="#0A0E16" stroke="#1E2A3A"/>
      <text x="165" y="206" font-size="15" font-weight="bold" letter-spacing="2" fill="#E6F1FF" text-anchor="middle">APPLICATIONS</text>
      <text x="165" y="228" font-size="11" fill="#7D8CA3" text-anchor="middle">web / api / edge devices</text>
    </g>

    <g>
      <rect x="470" y="150" width="260" height="120" rx="10" fill="#0A0E16" stroke="#00E5FF" stroke-opacity="0.35"/>
      <text x="600" y="180" font-size="15" font-weight="bold" letter-spacing="2" fill="#E6F1FF" text-anchor="middle">SMART ROUTER</text>
      <circle cx="530" cy="204" r="2" fill="#00E5FF"/>
      <text x="542" y="208" font-size="11" fill="#7D8CA3">semantic cache</text>
      <circle cx="530" cy="224" r="2" fill="#00E5FF"/>
      <text x="542" y="228" font-size="11" fill="#7D8CA3">token meter</text>
      <circle cx="530" cy="244" r="2" fill="#00E5FF"/>
      <text x="542" y="248" font-size="11" fill="#7D8CA3">context compressor</text>
    </g>

    <g>
      <rect x="920" y="55" width="220" height="80" rx="10" fill="#0A0E16" stroke="#8A7CFF" stroke-opacity="0.4"/>
      <text x="1030" y="90" font-size="15" font-weight="bold" letter-spacing="2" fill="#E6F1FF" text-anchor="middle">FRONTIER LLM</text>
      <text x="1030" y="112" font-size="11" fill="#7D8CA3" text-anchor="middle">cloud fallback only</text>
    </g>
    <text x="1030" y="42" font-size="12" letter-spacing="2" fill="#8A7CFF" text-anchor="middle">ESCALATION ~ 20%</text>

    <g>
      <rect x="920" y="300" width="220" height="80" rx="10" fill="#0A0E16" stroke="#3DFFA2" stroke-opacity="0.4"/>
      <text x="1030" y="335" font-size="15" font-weight="bold" letter-spacing="2" fill="#E6F1FF" text-anchor="middle">SLM FLEET</text>
      <text x="1030" y="357" font-size="11" fill="#7D8CA3" text-anchor="middle">gguf 4-bit / runs locally</text>
    </g>
    <text x="1030" y="405" font-size="12" letter-spacing="2" fill="#3DFFA2" text-anchor="middle">LOCAL HITS ~ 80%</text>

    <circle cx="60" cy="401" r="3.5" fill="#00E5FF"/>
    <text x="70" y="405" font-size="11" fill="#5A6B85">request</text>
    <circle cx="150" cy="401" r="3.5" fill="#3DFFA2"/>
    <text x="160" y="405" font-size="11" fill="#5A6B85">local hit</text>
    <circle cx="245" cy="401" r="3.5" fill="#8A7CFF"/>
    <text x="255" y="405" font-size="11" fill="#5A6B85">escalation</text>
  </g>

  <circle r="3.5" fill="#00E5FF">
    <animateMotion dur="2.2s" begin="0s" repeatCount="indefinite"><mpath xlink:href="#p1"/></animateMotion>
  </circle>
  <circle r="3.5" fill="#00E5FF">
    <animateMotion dur="2.2s" begin="-0.75s" repeatCount="indefinite"><mpath xlink:href="#p1"/></animateMotion>
  </circle>
  <circle r="3.5" fill="#00E5FF">
    <animateMotion dur="2.2s" begin="-1.5s" repeatCount="indefinite"><mpath xlink:href="#p1"/></animateMotion>
  </circle>

  <circle r="3.5" fill="#3DFFA2">
    <animateMotion dur="2.0s" begin="0s" repeatCount="indefinite"><mpath xlink:href="#p3"/></animateMotion>
  </circle>
  <circle r="3.5" fill="#3DFFA2">
    <animateMotion dur="2.0s" begin="-0.5s" repeatCount="indefinite"><mpath xlink:href="#p3"/></animateMotion>
  </circle>
  <circle r="3.5" fill="#3DFFA2">
    <animateMotion dur="2.0s" begin="-1.0s" repeatCount="indefinite"><mpath xlink:href="#p3"/></animateMotion>
  </circle>
  <circle r="3.5" fill="#3DFFA2">
    <animateMotion dur="2.0s" begin="-1.5s" repeatCount="indefinite"><mpath xlink:href="#p3"/></animateMotion>
  </circle>

  <circle r="3.5" fill="#8A7CFF">
    <animateMotion dur="3.6s" begin="0s" repeatCount="indefinite"><mpath xlink:href="#p2"/></animateMotion>
  </circle>
</svg>
