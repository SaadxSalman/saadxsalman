<svg width="1200" height="250" viewBox="0 0 1200 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Operations board">
  <rect x="8" y="8" width="1184" height="234" rx="10" fill="#0A0E16" stroke="#1B2534"/>
  <g font-family="'JetBrains Mono','Courier New',monospace">
    <text x="36" y="42" font-size="13" letter-spacing="3" fill="#E6F1FF" font-weight="bold">OPERATIONS BOARD</text>
    <circle cx="1102" cy="38" r="4" fill="#3DFFA2">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" calcMode="discrete" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="1114" y="42" font-size="12" letter-spacing="2" fill="#3D4C63">LIVE</text>
    <line x1="8" y1="58" x2="1192" y2="58" stroke="#1B2534"/>

    <circle cx="44" cy="84" r="4" fill="#3DFFA2">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="64" y="89" font-size="13" font-weight="bold" letter-spacing="2" fill="#00E5FF">BUILD</text>
    <text x="180" y="89" font-size="13" fill="#7D8CA3">local-first agent runtime on llama.cpp</text>
    <text x="1164" y="89" font-size="12" letter-spacing="2" fill="#3DFFA2" text-anchor="end">ACTIVE</text>

    <circle cx="44" cy="122" r="4" fill="#8A7CFF">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="64" y="127" font-size="13" font-weight="bold" letter-spacing="2" fill="#8A7CFF">RESEARCH</text>
    <text x="180" y="127" font-size="13" fill="#7D8CA3">speculative decoding + kv-cache quantization</text>
    <text x="1164" y="127" font-size="12" letter-spacing="2" fill="#8A7CFF" text-anchor="end">ONGOING</text>

    <circle cx="44" cy="160" r="4" fill="#00E5FF">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="64" y="165" font-size="13" font-weight="bold" letter-spacing="2" fill="#3DFFA2">UPSTREAM</text>
    <text x="180" y="165" font-size="13" fill="#7D8CA3">eval harnesses / quantization recipes / agent scaffolds</text>
    <text x="1164" y="165" font-size="12" letter-spacing="2" fill="#00E5FF" text-anchor="end">PUBLIC</text>

    <circle cx="44" cy="198" r="4" fill="#E6F1FF">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <text x="64" y="203" font-size="13" font-weight="bold" letter-spacing="2" fill="#E6F1FF">METER</text>
    <text x="180" y="203" font-size="13" fill="#7D8CA3">token spend per hop - cached locally, billed rarely</text>
    <text x="1164" y="203" font-size="12" letter-spacing="2" fill="#3DFFA2" text-anchor="end">CONTINUOUS</text>
  </g>
</svg>
