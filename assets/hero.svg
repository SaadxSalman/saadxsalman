<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Saad Salman - Machine Learning and Deep Learning Systems Engineer">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070B"/>
      <stop offset="1" stop-color="#080D16"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.5" stop-color="#EAF7FF"/>
      <stop offset="1" stop-color="#8A7CFF"/>
    </linearGradient>
    <pattern id="hgrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#7DD3FF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="hglow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="sweep">
      <rect x="-260" y="130" width="240" height="60">
        <animate attributeName="x" from="-260" to="1200" dur="5s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="320" fill="url(#hbg)"/>
  <rect width="1200" height="320" fill="url(#hgrid)"/>
  <rect x="14" y="14" width="1172" height="292" fill="none" stroke="#1B2534" stroke-width="1"/>

  <g stroke="#00E5FF" stroke-opacity="0.8" stroke-width="1.5" fill="none">
    <path d="M 14 40 V 14 H 40"/>
    <path d="M 1160 14 H 1186 V 40"/>
    <path d="M 1186 280 V 306 H 1160"/>
    <path d="M 40 306 H 14 V 280"/>
  </g>

  <g font-family="'JetBrains Mono','Courier New',monospace">
    <text x="52" y="38" font-size="12" fill="#3D4C63" letter-spacing="2">SAAL-OS // PROFILE INTERFACE</text>
    <text x="1148" y="38" font-size="12" fill="#3D4C63" letter-spacing="2" text-anchor="end">REV 5.0</text>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 120 168" to="360 120 168" dur="14s" repeatCount="indefinite"/>
      <circle cx="120" cy="168" r="46" fill="none" stroke="#00E5FF" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="40 249"/>
      <circle cx="120" cy="168" r="33" fill="none" stroke="#00E5FF" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="26 181"/>
      <circle cx="120" cy="168" r="20" fill="none" stroke="#00E5FF" stroke-opacity="0.14" stroke-width="1.5" stroke-dasharray="14 112"/>
    </g>
    <circle cx="120" cy="168" r="3" fill="#00E5FF">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 1080 168" to="0 1080 168" dur="14s" repeatCount="indefinite"/>
      <circle cx="1080" cy="168" r="46" fill="none" stroke="#8A7CFF" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="40 249"/>
      <circle cx="1080" cy="168" r="33" fill="none" stroke="#8A7CFF" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="26 181"/>
      <circle cx="1080" cy="168" r="20" fill="none" stroke="#8A7CFF" stroke-opacity="0.14" stroke-width="1.5" stroke-dasharray="14 112"/>
    </g>
    <circle cx="1080" cy="168" r="3" fill="#8A7CFF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>

    <text x="600" y="126" font-size="15" letter-spacing="6" fill="#00E5FF" fill-opacity="0.85" text-anchor="middle">MACHINE LEARNING x DEEP LEARNING SYSTEMS</text>

    <g font-weight="bold" text-anchor="middle" filter="url(#hglow)">
      <text x="600" y="182" font-size="58" letter-spacing="14" fill="#DCEBFF">SAAD SALMAN</text>
      <text x="600" y="182" font-size="58" letter-spacing="14" fill="url(#shine)" clip-path="url(#sweep)">SAAD SALMAN</text>
    </g>

    <path d="M 470 202 H 730" stroke="#1E2A3A" stroke-width="1" stroke-dasharray="2 6">
      <animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.2s" repeatCount="indefinite"/>
    </path>

    <text x="600" y="234" font-size="13" letter-spacing="3" fill="#7D8CA3" text-anchor="middle">LLM SYSTEMS / SLM OPTIMIZATION / LOCAL INFERENCE / TOKEN ECONOMY / OPEN SOURCE</text>

    <g font-size="11" letter-spacing="2">
      <circle cx="52" cy="285" r="3" fill="#3DFFA2">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="62" y="289" fill="#3D4C63">STATUS : OPERATIONAL</text>
      <text x="1148" y="289" fill="#3D4C63" text-anchor="end">TOKEN COST : OPTIMIZED</text>
    </g>

    <path d="M 40 302 H 1160" stroke="#0E1826" stroke-width="1"/>
    <path d="M 40 302 H 1160" stroke="#00E5FF" stroke-width="1" stroke-dasharray="80 1040" stroke-opacity="0.7">
      <animate attributeName="stroke-dashoffset" from="1120" to="0" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
