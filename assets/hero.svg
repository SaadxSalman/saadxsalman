<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SAAD X SALMAN - Neural Systems Engineer">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04070F"/>
      <stop offset="1" stop-color="#0A1420"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="0.5" stop-color="#7DF9FF"/>
      <stop offset="1" stop-color="#B537F2"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00F0FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00F0FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="glitchA">
      <rect x="0" y="96" width="1200" height="18">
        <animate attributeName="y" values="96;112;100;120;96" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="0.9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="glitchB">
      <rect x="0" y="136" width="1200" height="14">
        <animate attributeName="y" values="136;126;146;132;136" keyTimes="0;0.3;0.55;0.8;1" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <ellipse cx="600" cy="310" rx="520" ry="90" fill="#00F0FF" opacity="0.05"/>
  <ellipse cx="600" cy="310" rx="320" ry="60" fill="#B537F2" opacity="0.07"/>

  <g stroke="#00F0FF" stroke-opacity="0.65" stroke-width="2" fill="none">
    <path d="M 24 24 H 52 M 24 24 V 52"/>
    <path d="M 1176 24 H 1148 M 1176 24 V 52"/>
    <path d="M 24 276 H 52 M 24 276 V 248"/>
    <path d="M 1176 276 H 1148 M 1176 276 V 248"/>
  </g>

  <g font-family="'JetBrains Mono','Courier New',monospace">
    <text x="68" y="40" font-size="13" fill="#05FFA1" fill-opacity="0.9">SYS.CHECK :: ALL GREEN</text>
    <text x="1132" y="40" font-size="13" fill="#FF2A6D" fill-opacity="0.9" text-anchor="end">NEURAL LINK :: ESTABLISHED</text>
    <text x="68" y="272" font-size="12" fill="#00F0FF" fill-opacity="0.55">BUILD v4.0.1 // 2026</text>
    <text x="1132" y="272" font-size="12" fill="#B537F2" fill-opacity="0.75" text-anchor="end">TOKEN COST :: OPTIMIZED</text>
  </g>

  <g font-family="'JetBrains Mono','Courier New',monospace" font-weight="bold" text-anchor="middle">
    <text x="600" y="132" font-size="62" letter-spacing="8" fill="#05FFA1" opacity="0.7" clip-path="url(#glitchB)" dx="5">
      <animate attributeName="dx" values="0;5;-4;3;0" keyTimes="0;0.3;0.6;0.85;1" calcMode="discrete" dur="1.3s" repeatCount="indefinite"/>SAAD X SALMAN</text>
    <text x="600" y="132" font-size="62" letter-spacing="8" fill="#FF2A6D" opacity="0.7" clip-path="url(#glitchA)" dx="-5">
      <animate attributeName="dx" values="0;-5;4;-3;0" keyTimes="0;0.35;0.6;0.85;1" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/>SAAD X SALMAN</text>
    <text x="600" y="132" font-size="62" letter-spacing="8" fill="url(#titleGrad)" filter="url(#glow)">SAAD X SALMAN</text>
  </g>

  <rect x="902" y="98" width="14" height="38" fill="#00F0FF">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <g text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace">
    <text x="600" y="180" font-size="19" letter-spacing="4" fill="#7DF9FF">NEURAL SYSTEMS ENGINEER // LLM x SLM // LOCAL INFERENCE</text>
    <text x="600" y="208" font-size="14" letter-spacing="3" fill="#8B9BB4">TOKEN ECONOMICS * PRODUCTION-GRADE AI * OPEN SOURCE</text>
  </g>

  <rect x="0" y="-80" width="1200" height="70" fill="url(#scanGrad)">
    <animate attributeName="y" values="-80;300" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>
